<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Programa de Colas</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body class="container page-home">
    <header class="home-head">
      <h1 class="home-title">Programa de Colas</h1>
      <p class="home-sub">
        Entregue tickets a los clientes, atienda desde su escritorio y muestre los turnos en pantalla.
      </p>
    </header>

    <div class="row g-4">
      <div class="col-12 col-md-6">
        <section class="panel">
          <h2>Pantallas</h2>
          <p>Abra cada una en el dispositivo que le corresponda.</p>

          <a class="btn btn-primary" href="public.html">Pantalla pública</a>
          <a class="btn btn-secondary" href="new-ticket.html">Crear tickets</a>
        </section>
      </div>

      <div class="col-12 col-md-6">
        <section class="panel panel-dark">
          <h2>Atender clientes</h2>
          <p>Escriba el número de su escritorio para empezar.</p>

          <form action="desk.html">
            <input
              name="escritorio"
              type="text"
              class="form-control"
              placeholder="Escritorio"
              aria-label="Escritorio"
              autofocus
              required
            />

            <br />
            <button type="submit" class="btn btn-primary">Ingresar</button>
          </form>
        </section>
      </div>
    </div>
  </body>
</html>
