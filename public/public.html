<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Sistema de colas</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body class="page-board">
    <main class="board">
      <section class="board-current" aria-live="polite">
        <div class="board-label">Turno actual</div>
        <span id="lbl-ticket-01" class="ticket-current-number">Ticket W</span>
        <span id="lbl-desk-01" class="ticket-current-desk">Escritorio W</span>
      </section>

      <section class="board-history">
        <div class="board-label">Últimos llamados</div>

        <div class="history-item">
          <span id="lbl-ticket-02" class="ticket-secondary">Ticket X</span>
          <span id="lbl-desk-02" class="desk-name">Escritorio X</span>
        </div>

        <div class="history-item">
          <span id="lbl-ticket-03" class="ticket-secondary">Ticket Y</span>
          <span id="lbl-desk-03" class="desk-name">Escritorio Y</span>
        </div>

        <div class="history-item">
          <span id="lbl-ticket-04" class="ticket-secondary">Ticket Z</span>
          <span id="lbl-desk-04" class="desk-name">Escritorio Z</span>
        </div>
      </section>
    </main>

    <script src="./js/public.js"></script>
  </body>
</html>
