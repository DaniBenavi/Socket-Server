<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Escritorio | Programa de Colas</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body class="container page-desk">
    <div class="desk-head">
      <h1>Escritorio</h1>
      <a href="index.html">Volver al inicio</a>
    </div>

    <div class="row g-4">
      <div class="col-12 col-md-8">
        <div class="current-card">
          <h4>Atendiendo a <small class="text-primary">....</small></h4>

          <button class="btn btn-primary mt-5">Atender siguiente ticket</button>
        </div>
      </div>

      <div class="col-12 col-md-4">
        <div class="queue-card text-center">
          <h4>En cola</h4>

          <div class="alert alert-info mt-2">
            <span>Ya no hay más tickets</span>
          </div>

          <h1 id="lbl-pending">10</h1>
        </div>
      </div>
    </div>

    <script src="./js/desk.js"></script>
  </body>
</html>
